<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administração | CineVaals</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    :root{--bg:#050811;--panel:#091426;--panel2:#0d1b30;--text:#f4f7ff;--muted:#a8b7cf;--blue:#168bff;--blue2:#355cff;--line:#19385b;--glow:rgba(20,130,255,.2)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}
    body{margin:0;background:radial-gradient(ellipse at 50% 0%,#10213b 0,#050811 46rem);color:var(--text);font-family:'Inter',Arial,sans-serif;min-height:100vh;padding:0}
    main{max-width:1800px;margin:auto;padding:25px 18px 40px}
    header,.toolbar,.day-head,.item,.week-controls{display:flex;align-items:center;justify-content:space-between;gap:12px}
    header{padding:10px 18px;min-height:56px;background:rgba(3,9,20,.94);border-bottom:1px solid var(--line);margin:0 -18px 24px}
    h1{font-family:Georgia,serif;font-size:24px;color:#58baff;text-shadow:0 0 14px #006dff80;margin:0}h2,h3,p{margin-top:0}
    .subtitle{color:#9bc9f4;margin:8px 0 0;font-size:13px}.panel{padding:20px;margin-top:18px;background:linear-gradient(180deg,#09172a,#060d19);border:1px solid #16385b;border-radius:11px;box-shadow:0 5px 18px #0003}
    #admin-area{display:none}.login{max-width:520px;margin:32px auto}label{display:block;margin-top:13px;font-size:.95rem}
    input,select,textarea,button{font:inherit;border-radius:9px}input,select,textarea{width:100%;padding:11px;margin-top:6px;background:#071326;color:white;border:1px solid #21466e}input:focus,select:focus,textarea:focus{outline:none;border-color:#56b9ff;box-shadow:0 0 0 3px #168bff22}
    button{padding:10px 13px;border:1px solid #204b79;background:linear-gradient(180deg,#0b1c33,#071225);color:#dceeff;font-weight:700;cursor:pointer}button:hover{border-color:#4cb5ff;filter:brightness(1.08)}button:disabled{opacity:.5;cursor:wait}
    .primary{background:linear-gradient(135deg,#1454d9,#087bdc);border-color:#4db8ff;color:white}.secondary{background:#0a172a}.danger{background:#321421;border-color:#71344d;color:#ffc4d5}.small{padding:7px 10px;font-size:.82rem}
    .toolbar{align-items:flex-start;flex-wrap:wrap}.toolbar h2{font-family:Georgia,'Times New Roman',serif;font-size:clamp(25px,3vw,38px);margin:0 0 7px;color:#eaf5ff;text-shadow:0 0 18px #1c8fff55}.toolbar .subtitle:before{content:'✦ ';color:#328eff}
    .week-controls{margin:27px 0 16px;flex-wrap:wrap}.week-title{font-weight:700;text-align:center;flex:1;min-width:190px;color:#f3f8ff;font-size:14px}.week-title small{display:block;font-size:10px;color:#60b9ff;margin-top:4px;font-weight:normal}
    .days-wrap{overflow-x:auto;padding:0 0 12px;scrollbar-color:#1b568d #07101e;scrollbar-width:thin}.days{display:grid;grid-template-columns:repeat(7,minmax(160px,1fr));gap:10px;min-width:1160px;align-items:stretch}
    .day{background:linear-gradient(180deg,#09172a,#060d19);border:1px solid #16385b;border-radius:11px;overflow:hidden;min-width:0;box-shadow:0 5px 18px #0003;padding:0}.day-head{margin:0;padding:11px 10px;background:linear-gradient(100deg,#102846,#0a172a);border-bottom:1px solid #1b4774;align-items:center}.day-head h3{margin:0;font-size:12px;font-weight:bold;color:#a8dcff}.day-date{display:block;color:#c0d0e5;font-size:11px;margin-top:4px}.day-items{padding:7px;display:flex;flex-direction:column;gap:8px;min-height:130px}
    .item{background:rgba(8,21,39,.86);border:1px solid #122d4d;border-radius:8px;padding:6px;align-items:flex-start;gap:6px;transition:transform .15s,border-color .15s;cursor:grab;min-width:0}.item[draggable="true"]:active{cursor:grabbing}.item.dragging{opacity:.42;border:1px dashed #65bfff}.item.drag-over{border-color:#65bfff;box-shadow:0 0 0 2px #168bff33}.item:hover{transform:translateY(-2px);border-color:#2f83d1}.item-main{min-width:0;flex:1;align-self:stretch}.item-poster{display:block;width:100%;aspect-ratio:2/3;object-fit:contain;background:#050b16;border-radius:5px;border:1px solid #18395d}.item-poster-placeholder{width:100%;aspect-ratio:2/3;display:grid;place-items:center;background:#102846;color:#65bfff;font-size:25px;border-radius:5px}.item-actions{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;align-content:flex-start}.item-actions button{padding:5px 7px;min-width:30px}.empty{color:#6e819c;font-size:11px;text-align:center;padding:24px 5px}.empty:before{content:'✧';display:block;font-size:19px;color:#235789;margin-bottom:7px}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.full{grid-column:1/-1}
    #editor{position:fixed;inset:0;z-index:1000;overflow-y:auto;margin:0;padding:24px;background:rgba(1,5,13,.82);backdrop-filter:blur(5px);border:0;border-radius:0;box-shadow:none}
    .editor-card{max-width:850px;margin:2vh auto 5vh;padding:22px;background:linear-gradient(180deg,#09172a,#060d19);border:1px solid #2c5f91;border-radius:14px;box-shadow:0 20px 70px #0009}
    .search-box{margin-bottom:16px;padding:14px;background:#071326;border:1px solid #21466e;border-radius:10px}.search-row{display:flex;gap:8px;align-items:stretch}.search-row input{min-width:0;flex:1}.search-row button{margin-top:6px;white-space:nowrap}
    .catalog-results{display:grid;gap:8px;margin-top:10px;max-height:42vh;overflow-y:auto}.catalog-result{display:flex;align-items:center;gap:10px;text-align:left;width:100%;background:#0b1c33;border:1px solid #21466e}.catalog-result img{width:42px;height:62px;object-fit:cover;border-radius:4px;background:#15243a;flex-shrink:0}.catalog-result span{display:block}.catalog-result .result-title{font-size:14px;color:#f4f7ff}.catalog-result .result-meta{font-size:11px;color:#9bc9f4;margin-top:4px}.catalog-message{font-size:13px;color:#9bc9f4;margin:10px 0 0}
    #status{overflow-wrap:anywhere;color:#65bfff;min-height:1.2em;margin:14px 0 0}.hidden{display:none!important}
    @media(max-width:700px){#editor{padding:12px}.editor-card{margin:0 auto 20px;padding:15px}.search-row{flex-direction:column}.search-row button{margin-top:0}.catalog-results{max-height:38vh}}
    @media(max-width:700px){main{padding:20px 12px 30px}header{margin:0 -12px 20px;padding:8px 12px}h1{font-size:20px}.days{grid-template-columns:repeat(7,minmax(155px,1fr));min-width:1160px}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.week-controls button{font-size:.78rem;padding:9px 8px}.week-title{min-width:0}.toolbar{align-items:flex-start}}
  </style>
</head>
<body>
<main>
  <header>
    <div><h1>CineVaals</h1><p class="subtitle">Painel administrativo</p></div>
    <button id="logout" class="secondary hidden" type="button">Sair</button>
  </header>

  <section id="login-area" class="panel login">
    <h2>Entrar</h2>
    <form id="login-form">
      <label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required>
      <label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required>
      <button type="submit" style="width:100%;margin-top:18px">Entrar</button>
    </form>
  </section>

  <section id="admin-area">
    <div class="toolbar">
      <div><h2 style="margin-bottom:5px">✧ Cronograma Semanal</h2><p class="subtitle" style="margin-bottom:0">Gerencie a programação do CineVaals por aqui.</p></div>
      <button id="new-content" class="primary" type="button">＋ Gerenciar Catálogo</button>
    </div>
    <div class="week-controls">
      <button id="prev-week" class="secondary" type="button">← Semana anterior</button>
      <div id="week-title" class="week-title"></div>
      <button id="next-week" class="secondary" type="button">Próxima semana →</button>
    </div>
    <div id="days" class="days"></div>

    <section id="catalog-manager" class="hidden" aria-modal="true" role="dialog" aria-labelledby="catalog-manager-title" style="position:fixed;inset:0;z-index:1100;overflow-y:auto;padding:20px;background:rgba(1,5,13,.88);backdrop-filter:blur(5px)">
      <div class="editor-card" style="max-width:1000px">
        <div class="toolbar"><div><h2 id="catalog-manager-title">✧ Catálogo CineVaals</h2><p class="subtitle">Independente do cronograma semanal.</p></div><button id="close-catalog-manager" class="secondary" type="button">Fechar</button></div>
        <div class="search-box"><label for="catalog-manager-query">Buscar conteúdo para cadastrar</label><div class="search-row"><input id="catalog-manager-query" type="search" placeholder="Digite o nome de um filme ou série..." autocomplete="off"><button id="catalog-manager-search" class="primary" type="button">Buscar por título</button></div><div id="catalog-manager-results" class="catalog-results" role="listbox" aria-label="Resultados da busca"></div></div>
        <form id="catalog-form">
          <input id="catalog-id" type="hidden">
          <div class="form-grid">
            <div class="full"><label for="catalog-item-title">Título *</label><input id="catalog-item-title" required maxlength="200"></div>
            <div><label for="catalog-item-category">Categoria *</label><select id="catalog-item-category" required><option value="Filme">Filmes</option><option value="Série">Séries</option><option value="Animação">Animações</option><option value="Dorama">Doramas</option><option value="Anime">Animes</option></select></div>
            <div><label for="catalog-item-status">Status *</label><select id="catalog-item-status" required><option value="Já Assistido">Já Assistido</option><option value="Está no Cronograma">Está no Cronograma</option><option value="Está na Fila" selected>Está na Fila</option></select></div>
            <div id="catalog-season-wrap" class="full hidden"><label for="catalog-item-season">Temporada *</label><select id="catalog-item-season"><option value="">Selecione a temporada</option><option value="Temporada 1">Temporada 1</option><option value="Temporada 2">Temporada 2</option><option value="Temporada 3">Temporada 3</option><option value="Temporada 4">Temporada 4</option><option value="Temporada 5">Temporada 5</option><option value="Temporada 6">Temporada 6</option><option value="Temporada 7">Temporada 7</option><option value="Temporada 8">Temporada 8</option><option value="Temporada 9">Temporada 9</option><option value="Temporada 10">Temporada 10</option><option value="Temporada 11">Temporada 11</option><option value="Temporada 12">Temporada 12</option><option value="Temporada 13">Temporada 13</option><option value="Temporada 14">Temporada 14</option><option value="Temporada 15">Temporada 15</option><option value="Temporada 16">Temporada 16</option><option value="Temporada 17">Temporada 17</option><option value="Temporada 18">Temporada 18</option><option value="Temporada 19">Temporada 19</option><option value="Temporada 20">Temporada 20</option><option value="Todas as temporadas">Todas as temporadas</option></select></div>
            <div class="full"><label for="catalog-item-image">URL da imagem</label><input id="catalog-item-image" type="url" placeholder="https://..."></div>
            <div class="full"><label for="catalog-item-description">Descrição (opcional)</label><textarea id="catalog-item-description" rows="3"></textarea></div>
          </div>
          <div class="toolbar" style="margin-top:15px;justify-content:flex-start"><button id="save-catalog-item" class="primary" type="submit">Salvar no catálogo</button><button id="cancel-catalog-item" class="secondary" type="button">Limpar formulário</button></div>
        </form>
        <hr style="border-color:#19385b;margin:24px 0">
        <div class="toolbar"><h3 style="margin:0">Títulos cadastrados</h3><input id="catalog-admin-search" type="search" placeholder="Buscar título..." style="max-width:320px;margin-top:0"></div>
        <p id="catalog-admin-status" class="subtitle" role="status"></p>
        <div id="catalog-admin-list" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:14px"></div>
      </div>
    </section>
    <section id="editor" class="hidden" aria-modal="true" role="dialog" aria-labelledby="editor-title">
      <div class="editor-card">
      <h2 id="editor-title">Adicionar conteúdo</h2>
      <form id="content-form">
        <div class="search-box full">
          <label for="catalog-query">Buscar por título</label>
          <div class="search-row">
            <input id="catalog-query" type="search" placeholder="Digite o nome de um filme ou série" autocomplete="off">
            <button id="catalog-search" class="primary" type="button">Buscar por título</button>
          </div>
          <div id="catalog-results" class="catalog-results" role="listbox" aria-label="Resultados da busca"></div>
        </div>
        <div class="form-grid">
          <div class="full"><label for="title">Título *</label><input id="title" required maxlength="200"></div>
          <div><label for="category">Categoria *</label><select id="category" required>
            <option value="Filme">Filmes</option><option value="Série">Séries</option><option value="Animação">Animações</option><option value="Dorama">Doramas</option><option value="Anime">Animes</option>
          </select></div>
          <div><label for="date">Data *</label><input id="date" type="date" required></div>
          <div><label for="time">Horário (opcional)</label><input id="time" type="time"></div>
          <div><label for="image">URL da imagem</label><input id="image" type="url" placeholder="https://..."></div>
          <div class="full"><label for="description">Descrição</label><textarea id="description" rows="3"></textarea></div>
        </div>
        <div class="toolbar" style="margin-top:15px;justify-content:flex-start;flex-wrap:wrap">
          <button id="save-content" type="submit">Salvar conteúdo</button>
          <button id="cancel-edit" class="secondary" type="button">Cancelar</button>
        </div>
      </form>
      </div>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
  </section>
</main>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const SUPABASE_URL = 'https://bfiikxuyratcvhfmdeia.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_y0BudXGL8t3yDJLE4h5IZg_UZRPHJk6';
  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
  const $ = id => document.getElementById(id);
  const status = $('status');
  let weekStart = mondayOf(new Date());
  let contents = [];
  let editingId = null;
  let draggedId = null;
  let catalogSearchTimer = null;
  let catalogSearchSequence = 0;
  let catalogItems = [];
  let editingCatalogId = null;
  let managerSearchTimer = null;
  let managerSearchSequence = 0;


  function mondayOf(date){ const d = new Date(date); d.setHours(12,0,0,0); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return d; }
  function dateKey(date){ return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`; }
  function parseDate(value){ const [y,m,d]=value.split('-').map(Number); return new Date(y,m-1,d,12); }
  function prettyDate(date, options={day:'2-digit',month:'2-digit'}){ return date.toLocaleDateString('pt-BR',options); }
  function escapeHtml(value=''){ return String(value).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  async function verifyAdmin(){
    const {data,error}=await supabase.rpc('is_cinevaals_admin');
    if(error || data!==true){
      await supabase.auth.signOut();
      $('login-area').style.display='block'; $('admin-area').style.display='none'; $('logout').classList.add('hidden');
      status.textContent='Acesso administrativo não autorizado.'; return false;
    }
    $('login-area').style.display='none'; $('admin-area').style.display='block'; $('logout').classList.remove('hidden');
    await loadContents(); return true;
  }

  async function loadContents(){
    status.textContent='Carregando cronograma...';
    const {data,error}=await supabase.from('contents').select('*').order('date',{ascending:true}).order('sort_order',{ascending:true}).order('time',{ascending:true});
    if(error){ status.textContent='Erro ao carregar: '+error.message; return; }
    contents=data||[]; render(); status.textContent='';
  }

  function render(){
    const end=new Date(weekStart); end.setDate(end.getDate()+6);
    $('week-title').textContent=`${prettyDate(weekStart,{day:'2-digit',month:'short'})} – ${prettyDate(end,{day:'2-digit',month:'short',year:'numeric'})}`;
    const weekdays=['Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado','Domingo'];
    $('days').innerHTML=weekdays.map((name,i)=>{
      const d=new Date(weekStart); d.setDate(d.getDate()+i); const key=dateKey(d);
      const dayItems=contents.filter(item=>item.date===key).sort((a,b)=>{const ao=Number.isFinite(Number(a.sort_order))?Number(a.sort_order):999999;const bo=Number.isFinite(Number(b.sort_order))?Number(b.sort_order):999999;return ao-bo||(a.time||'99:99').localeCompare(b.time||'99:99');});
      const cards=dayItems.length?dayItems.map(item=>`
        <article class="item" draggable="true" data-drag-id="${escapeHtml(item.id)}" aria-label="${escapeHtml(item.title)}">
          <div class="item-main">${item.image?`<img class="item-poster" src="${escapeHtml(item.image)}" alt="Capa de ${escapeHtml(item.title)}" loading="lazy" onerror="this.outerHTML='<div class=&quot;item-poster-placeholder&quot;>🎬</div>'">`:'<div class="item-poster-placeholder">🎬</div>'}</div>
          <div class="item-actions">
            <button class="small secondary" type="button" data-edit="${escapeHtml(item.id)}" aria-label="Editar ${escapeHtml(item.title)}">✎</button>
            <button class="small danger" type="button" data-delete="${escapeHtml(item.id)}" aria-label="Excluir ${escapeHtml(item.title)}">✕</button>
          </div>
        </article>`).join(''):'<div class="empty">Nenhum conteúdo programado.</div>';
      return `<section class="day"><div class="day-head"><div><h3>${name}</h3><span class="day-date">${prettyDate(d,{day:'2-digit',month:'short',year:'numeric'})}</span></div><button class="small primary" type="button" data-add-date="${key}" aria-label="Adicionar conteúdo em ${name}">＋</button></div><div class="day-items">${cards}</div></section>`;
    }).join('');
  }

  function openEditor(item=null, date=''){
    editingId=item?.id??null;
    $('editor-title').textContent=item?'Editar conteúdo':'Adicionar conteúdo';
    $('title').value=item?.title||''; $('category').value=item?.category||'Filme';
    $('date').value=item?.date||date||dateKey(weekStart);
    $('time').value=item?.time||''; $('image').value=item?.image||'';
    $('description').value=item?.description||'';
    $('save-content').textContent=item?'Salvar alterações':'Salvar conteúdo';
    $('catalog-query').value='';
    $('catalog-results').innerHTML='';
    $('catalog-results').dataset.results='[]';
    $('editor').classList.remove('hidden');
    document.body.style.overflow='hidden';
    $('title').focus();
  }
  function closeEditor(){
    $('editor').classList.add('hidden');
    document.body.style.overflow='';
    $('content-form').reset();
    $('catalog-query').value='';
    $('catalog-results').innerHTML='';
    $('catalog-results').dataset.results='[]';
    editingId=null;
  }
  $('editor').addEventListener('click',event=>{
    if(event.target===$('editor'))closeEditor();
  });
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape' && !$('editor').classList.contains('hidden'))closeEditor();
  });

  $('login-form').addEventListener('submit',async event=>{
    event.preventDefault(); status.textContent='Verificando acesso...';
    const {error}=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
    if(error){status.textContent='Erro: '+error.message;return;}
    await verifyAdmin();
  });
  function showCatalogMessage(message){
    $('catalog-results').innerHTML = message ? `<p class="catalog-message">${escapeHtml(message)}</p>` : '';
  }

  $('catalog-search').addEventListener('click', searchCatalog);
  $('catalog-query').addEventListener('input',()=>{
    clearTimeout(catalogSearchTimer);
    const query=$('catalog-query').value.trim();
    catalogSearchSequence++;
    if(query.length<2){
      $('catalog-results').innerHTML='';
      $('catalog-results').dataset.results='[]';
      return;
    }
    showCatalogMessage('Procurando sugestões...');
    catalogSearchTimer=setTimeout(()=>searchCatalog(true),350);
  });
  $('catalog-query').addEventListener('keydown', event=>{
    if(event.key==='Enter'){event.preventDefault();clearTimeout(catalogSearchTimer);searchCatalog();}
  });

  async function searchCatalog(automatic=false){
    const query=$('catalog-query').value.trim();
    if(!query){showCatalogMessage('Digite um título para pesquisar.');return;}
    const searchId=++catalogSearchSequence;
    if(!automatic){
      $('catalog-search').disabled=true;
      $('catalog-search').textContent='Buscando...';
      showCatalogMessage('Buscando filmes e séries...');
    }
    try{
      const {data:sessionData}=await supabase.auth.getSession();
      const token=sessionData.session?.access_token;
      if(!token){showCatalogMessage('Sua sessão expirou. Entre novamente no painel.');return;}
      const {data,error}=await supabase.functions.invoke('tmdb-search',{
        body:{query},
        headers:{Authorization:`Bearer ${token}`}
      });
      if(error) throw error;
      if(searchId!==catalogSearchSequence || query!==$('catalog-query').value.trim())return;
      const results=Array.isArray(data)?data:(data?.results||[]);
      if(!results.length){showCatalogMessage('Nenhuma sugestão encontrada. Tente continuar digitando.');return;}
      $('catalog-results').innerHTML=results.map((item,index)=>{
        const title=item.title||item.name||'Sem título';
        const type=item.media_type||(item.title?'movie':'tv');
        const year=(item.release_date||item.first_air_date||'').slice(0,4);
        const poster=item.poster_path?`https://image.tmdb.org/t/p/w185${item.poster_path}`:'';
        return `<button class="catalog-result" type="button" data-result-index="${index}">
          ${poster?`<img src="${escapeHtml(poster)}" alt="" loading="lazy">`:'<span class="catalog-result-poster" aria-hidden="true">🎬</span>'}
          <span><span class="result-title">${escapeHtml(title)}</span><span class="result-meta">${type==='tv'?'Série':'Filme'}${year?' · '+escapeHtml(year):''}</span></span>
        </button>`;
      }).join('');
      $('catalog-results').dataset.results=JSON.stringify(results);
    }catch(error){
      console.error('Erro na busca de catálogo:',error);
      if(searchId===catalogSearchSequence)showCatalogMessage('Não foi possível realizar a busca. Confira sua conexão e tente novamente.');
    }finally{
      if(!automatic){
        $('catalog-search').disabled=false;
        $('catalog-search').textContent='Buscar por título';
      }
    }
  }

  $('catalog-results').addEventListener('click',event=>{
    const button=event.target.closest('[data-result-index]');
    if(!button)return;
    const results=JSON.parse($('catalog-results').dataset.results||'[]');
    const item=results[Number(button.dataset.resultIndex)];
    if(!item)return;
    const type=item.media_type||(item.title?'movie':'tv');
    $('title').value=item.title||item.name||'';
    $('category').value=type==='tv'?'Série':'Filme';
    $('image').value=item.poster_path?`https://image.tmdb.org/t/p/w500${item.poster_path}`:'';
    $('description').value=item.overview||'';
    showCatalogMessage('Dados preenchidos. Confira a categoria e escolha a data e o horário antes de salvar.');
    $('title').focus();
  });

  $('content-form').addEventListener('submit',async event=>{
    event.preventDefault(); $('save-content').disabled=true; status.textContent='Salvando conteúdo...';
    const targetDate=$('date').value;
    const existingForDate=contents.filter(x=>x.date===targetDate && String(x.id)!==String(editingId));
    const nextOrder=existingForDate.reduce((max,x)=>Math.max(max,Number(x.sort_order)||0),-1)+1;
    const content={title:$('title').value.trim(),category:$('category').value,date:targetDate,image:$('image').value.trim()||null,description:$('description').value.trim()||null,time:$('time').value||null,sort_order:editingId?(contents.find(x=>String(x.id)===String(editingId))?.date===targetDate?(contents.find(x=>String(x.id)===String(editingId))?.sort_order??nextOrder):nextOrder):nextOrder};
    const result=editingId?await supabase.from('contents').update(content).eq('id',editingId):await supabase.from('contents').insert(content);
    $('save-content').disabled=false;
    if(result.error){status.textContent='Erro ao salvar: '+result.error.message;return;}
    closeEditor(); await loadContents(); status.textContent=editingId?'':'Conteúdo salvo com sucesso!';
  });
  $('days').addEventListener('click',async event=>{
    const edit=event.target.closest('[data-edit]'), del=event.target.closest('[data-delete]'), add=event.target.closest('[data-add-date]');
    if(add){openEditor(null,add.dataset.addDate);return;}
    if(edit){const item=contents.find(x=>String(x.id)===edit.dataset.edit);if(item)openEditor(item);return;}
    if(del){
      const item=contents.find(x=>String(x.id)===del.dataset.delete); if(!item)return;
      if(!confirm(`Excluir "${item.title}" do cronograma?`))return;
      status.textContent='Excluindo conteúdo...';
      const {error}=await supabase.from('contents').delete().eq('id',item.id);
      if(error){status.textContent='Erro ao excluir: '+error.message;return;}
      await loadContents(); status.textContent='Conteúdo excluído.';
    }
  });
  $('days').addEventListener('dragstart', event=>{
    const card=event.target.closest('[data-drag-id]');
    if(!card)return;
    draggedId=card.dataset.dragId;
    card.classList.add('dragging');
    event.dataTransfer.effectAllowed='move';
    event.dataTransfer.setData('text/plain',draggedId);
  });
  $('days').addEventListener('dragover', event=>{
    const target=event.target.closest('[data-drag-id]');
    if(!target || !draggedId || target.dataset.dragId===draggedId)return;
    const source=contents.find(x=>String(x.id)===String(draggedId));
    const destination=contents.find(x=>String(x.id)===target.dataset.dragId);
    if(!source || !destination || source.date!==destination.date)return;
    event.preventDefault();
    document.querySelectorAll('.item.drag-over').forEach(el=>el.classList.remove('drag-over'));
    target.classList.add('drag-over');
  });
  $('days').addEventListener('drop', async event=>{
    const target=event.target.closest('[data-drag-id]');
    if(!target || !draggedId)return;
    const source=contents.find(x=>String(x.id)===String(draggedId));
    const destination=contents.find(x=>String(x.id)===target.dataset.dragId);
    if(!source || !destination || source.date!==destination.date)return;
    event.preventDefault();
    const sameDay=contents.filter(x=>x.date===source.date).sort((a,b)=>{
      const ao=Number.isFinite(Number(a.sort_order))?Number(a.sort_order):999999;
      const bo=Number.isFinite(Number(b.sort_order))?Number(b.sort_order):999999;
      return ao-bo||(a.time||'99:99').localeCompare(b.time||'99:99');
    });
    const from=sameDay.findIndex(x=>String(x.id)===String(draggedId));
    const to=sameDay.findIndex(x=>String(x.id)===target.dataset.dragId);
    if(from<0||to<0)return;
    const [moved]=sameDay.splice(from,1);sameDay.splice(to,0,moved);
    status.textContent='Salvando nova ordem...';
    const updates=await Promise.all(sameDay.map((item,index)=>supabase.from('contents').update({sort_order:index}).eq('id',item.id)));
    const failed=updates.find(result=>result.error);
    if(failed){status.textContent='Não foi possível salvar a ordem. Verifique se a coluna sort_order foi criada no Supabase.';await loadContents();return;}
    await loadContents();status.textContent='Ordem atualizada!';
  });
  $('days').addEventListener('dragend',()=>{
    draggedId=null;
    document.querySelectorAll('.item.dragging,.item.drag-over').forEach(el=>el.classList.remove('dragging','drag-over'));
  });


  function updateCatalogSeasonField(){const isMovie=$('catalog-item-category').value==='Filme';$('catalog-season-wrap').classList.toggle('hidden',isMovie);$('catalog-item-season').required=!isMovie;if(isMovie)$('catalog-item-season').value='';}
  function resetCatalogForm(){editingCatalogId=null;$('catalog-id').value='';$('catalog-form').reset();$('catalog-item-status').value='Está na Fila';$('save-catalog-item').textContent='Salvar no catálogo';updateCatalogSeasonField();}
  function renderCatalogAdmin(){
    const term=$('catalog-admin-search').value.trim().toLocaleLowerCase('pt-BR');
    const list=catalogItems.filter(item=>String(item.title||'').toLocaleLowerCase('pt-BR').includes(term));
    $('catalog-admin-list').innerHTML=list.map(item=>`<article style="display:flex;gap:10px;padding:10px;border:1px solid #19385b;border-radius:9px;background:#071326;min-width:0">${item.image?`<img src="${escapeHtml(item.image)}" alt="" style="width:54px;height:80px;object-fit:cover;border-radius:5px" onerror="this.style.display='none'">`:''}<div style="min-width:0;flex:1"><strong style="display:block;overflow-wrap:anywhere">${escapeHtml(item.title)}</strong><small style="display:block;color:#9bc9f4;margin:5px 0">${escapeHtml(item.category)} · ${escapeHtml(item.status)}</small><div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:8px"><button type="button" class="small" data-catalog-edit="${item.id}">Editar</button><button type="button" class="small danger" data-catalog-delete="${item.id}">Excluir</button></div></div></article>`).join('')||'<p class="subtitle">Nenhum título encontrado.</p>';
  }
  async function loadCatalogAdmin(){
    $('catalog-admin-status').textContent='Carregando catálogo...';
    const {data,error}=await supabase.from('catalog').select('*').order('sort_order',{ascending:true}).order('title',{ascending:true});
    if(error){$('catalog-admin-status').textContent='Erro ao carregar catálogo: '+error.message;return;}
    catalogItems=data||[];renderCatalogAdmin();$('catalog-admin-status').textContent=`${catalogItems.length} título(s) no catálogo.`;
  }
  async function openCatalogManager(){
    $('catalog-manager').classList.remove('hidden');resetCatalogForm();await loadCatalogAdmin();
  }
  $('new-content').addEventListener('click',openCatalogManager);
  $('catalog-item-category').addEventListener('change',updateCatalogSeasonField);
  $('catalog-manager-search').addEventListener('click',()=>searchCatalogForManager(false));
  $('catalog-manager-query').addEventListener('input',()=>{
    clearTimeout(managerSearchTimer);
    const query=$('catalog-manager-query').value.trim();
    managerSearchSequence++;
    if(query.length<2){$('catalog-manager-results').innerHTML='';$('catalog-manager-results').dataset.results='[]';return;}
    $('catalog-manager-results').innerHTML='<p class="catalog-message">Procurando sugestões...</p>';
    managerSearchTimer=setTimeout(()=>searchCatalogForManager(true),350);
  });
  $('catalog-manager-query').addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();clearTimeout(managerSearchTimer);searchCatalogForManager(false);}});
  async function searchCatalogForManager(automatic=false){
    const query=$('catalog-manager-query').value.trim(), box=$('catalog-manager-results');
    if(!query){box.innerHTML='<p class="catalog-message">Digite um título para pesquisar.</p>';return;}
    if(query.length<2){box.innerHTML='<p class="catalog-message">Digite pelo menos 2 caracteres para ver sugestões.</p>';return;}
    const searchId=++managerSearchSequence;
    if(!automatic){$('catalog-manager-search').disabled=true;$('catalog-manager-search').textContent='Buscando...';box.innerHTML='<p class="catalog-message">Buscando filmes e séries...</p>';}
    try{
      const {data:sessionData}=await supabase.auth.getSession(), token=sessionData.session?.access_token;
      if(!token)throw new Error('Sua sessão expirou. Entre novamente no painel.');
      const {data,error}=await supabase.functions.invoke('tmdb-search',{body:{query},headers:{Authorization:'Bearer '+token}});
      if(error)throw error;
      if(searchId!==managerSearchSequence || query!==$('catalog-manager-query').value.trim())return;
      const results=Array.isArray(data)?data:(data?.results||[]);
      if(!results.length){box.dataset.results='[]';box.innerHTML='<p class="catalog-message">Nenhuma sugestão encontrada. Tente continuar digitando.</p>';return;}
      box.dataset.results=JSON.stringify(results);
      box.innerHTML=results.map((item,index)=>{
        const title=item.title||item.name||'Sem título', type=item.media_type||(item.title?'movie':'tv');
        const year=(item.release_date||item.first_air_date||'').slice(0,4);
        const poster=item.poster_path?'https://image.tmdb.org/t/p/w185'+item.poster_path:'';
        return '<button class="catalog-result" type="button" data-manager-result="'+index+'">'+(poster?'<img src="'+escapeHtml(poster)+'" alt="" loading="lazy">':'<span>🎬</span>')+'<span><span class="result-title">'+escapeHtml(title)+'</span><span class="result-meta">'+(type==='tv'?'Série':'Filme')+(year?' · '+escapeHtml(year):'')+'</span></span></button>';
      }).join('');
    }catch(error){if(searchId===managerSearchSequence)box.innerHTML='<p class="catalog-message">'+escapeHtml(error.message||'Não foi possível buscar conteúdo.')+'</p>';}
    finally{if(!automatic){$('catalog-manager-search').disabled=false;$('catalog-manager-search').textContent='Buscar por título';}}
  }
  $('catalog-manager-results').addEventListener('click',event=>{
    const button=event.target.closest('[data-manager-result]');if(!button)return;
    const results=JSON.parse($('catalog-manager-results').dataset.results||'[]'),item=results[Number(button.dataset.managerResult)];if(!item)return;
    const type=item.media_type||(item.title?'movie':'tv');
    $('catalog-item-title').value=item.title||item.name||'';
    $('catalog-item-category').value=type==='tv'?'Série':'Filme';
    $('catalog-item-image').value=item.poster_path?'https://image.tmdb.org/t/p/w500'+item.poster_path:'';
    $('catalog-item-description').value=item.overview||'';
    $('catalog-item-season').value='';updateCatalogSeasonField();
    $('catalog-admin-status').textContent='Dados preenchidos. Selecione a temporada e salve no catálogo.';
    $('catalog-item-title').focus();
  });

  $('close-catalog-manager').addEventListener('click',()=>$('catalog-manager').classList.add('hidden'));
  $('cancel-catalog-item').addEventListener('click',resetCatalogForm);
  $('catalog-admin-search').addEventListener('input',renderCatalogAdmin);
  $('catalog-form').addEventListener('submit',async event=>{
    event.preventDefault();$('save-catalog-item').disabled=true;$('catalog-admin-status').textContent='Salvando título...';
    const item={title:$('catalog-item-title').value.trim(),category:$('catalog-item-category').value,status:$('catalog-item-status').value,season:$('catalog-item-category').value==='Filme'?null:($('catalog-item-season').value.trim()||null),image:$('catalog-item-image').value.trim()||null,description:$('catalog-item-description').value.trim()||null};
    const result=editingCatalogId?await supabase.from('catalog').update(item).eq('id',editingCatalogId):await supabase.from('catalog').insert(item);
    $('save-catalog-item').disabled=false;
    if(result.error){$('catalog-admin-status').textContent='Erro ao salvar: '+result.error.message;return;}
    resetCatalogForm();await loadCatalogAdmin();$('catalog-admin-status').textContent='Título salvo com sucesso. '+catalogItems.length+' título(s) no catálogo.';
  });
  $('catalog-admin-list').addEventListener('click',async event=>{
    const edit=event.target.closest('[data-catalog-edit]'),del=event.target.closest('[data-catalog-delete]');
    if(edit){const item=catalogItems.find(x=>String(x.id)===edit.dataset.catalogEdit);if(!item)return;editingCatalogId=item.id;$('catalog-id').value=item.id;$('catalog-item-title').value=item.title||'';$('catalog-item-category').value=item.category||'Filme';$('catalog-item-status').value=item.status||'Está na Fila';$('catalog-item-image').value=item.image||'';$('catalog-item-description').value=item.description||'';$('catalog-item-season').value=item.season||'';updateCatalogSeasonField();$('save-catalog-item').textContent='Salvar alterações';$('catalog-item-title').focus();return;}
    if(del){const item=catalogItems.find(x=>String(x.id)===del.dataset.catalogDelete);if(!item||!confirm(`Excluir "${item.title}" do catálogo? Isso não altera o cronograma.`))return;const {error}=await supabase.from('catalog').delete().eq('id',item.id);if(error){$('catalog-admin-status').textContent='Erro ao excluir: '+error.message;return;}await loadCatalogAdmin();$('catalog-admin-status').textContent='Título excluído do catálogo.';}
  });

  $('cancel-edit').addEventListener('click',closeEditor);
  $('prev-week').addEventListener('click',()=>{weekStart.setDate(weekStart.getDate()-7);render();});
  $('next-week').addEventListener('click',()=>{weekStart.setDate(weekStart.getDate()+7);render();});
  $('logout').addEventListener('click',async()=>{await supabase.auth.signOut();$('admin-area').style.display='none';$('login-area').style.display='block';$('logout').classList.add('hidden');status.textContent='Você saiu do painel.';});
  const {data:sessionData}=await supabase.auth.getSession();
  if(sessionData.session) await verifyAdmin();
</script>
</body>
</html>
