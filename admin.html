<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administração | CineVaals</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }
    main {
      max-width: 650px;
      margin: 0 auto;
    }
    h1 { color: #f17bb5; }
    label {
      display: block;
      margin-top: 15px;
    }
    input, select, textarea, button {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #555;
      border-radius: 8px;
      font: inherit;
    }
    input, select, textarea {
      background: #222;
      color: white;
    }
    button {
      margin-top: 18px;
      border: 0;
      background: #e85d9e;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .secondary { background: #444; }
    #status { overflow-wrap: anywhere; }
    #login-area, #admin-area {
      padding: 20px;
      margin-top: 20px;
      background: #1e1e1e;
      border-radius: 12px;
    }
    #admin-area { display: none; }
  </style>
</head>
<body>
<main>
  <h1>CineVaals</h1>
  <p>Painel administrativo</p>

  <section id="login-area">
    <h2>Entrar</h2>
    <form id="login-form">
      <label for="email">E-mail</label>
      <input id="email" type="email" required>

      <label for="password">Senha</label>
      <input id="password" type="password" required>

      <button type="submit">Entrar</button>
    </form>
  </section>

  <section id="admin-area">
    <h2>Cadastrar conteúdo</h2>
    <form id="content-form">
      <label for="title">Título *</label>
      <input id="title" required>

      <label for="category">Categoria *</label>
      <select id="category" required>
        <option value="Filme">Filmes</option>
        <option value="Série">Séries</option>
        <option value="Animação">Animações</option>
        <option value="Dorama">Doramas</option>
        <option value="Anime">Animes</option>
      
      </select>

      <label for="status">Status *</label>
      <select id="status" required>
        <option value="PARA ASSISTIR">📌 Para assistir</option>
        <option value="ASSISTIDO">✅ Assistido</option>
      </select>

      <label for="date">Data *</label>

      <input id="date" type="date" required>

      <label for="image">URL da imagem</label>
      <input id="image" type="url" placeholder="https://...">

      <label for="description">Descrição</label>
      <textarea id="description" rows="4"></textarea>

      <label for="time">Horário (opcional)</label>
      <input id="time" type="time">

      <button type="submit">Salvar conteúdo</button>
    </form>

    <p id="status" role="status"></p>
    <button id="logout" class="secondary" type="button">Sair</button>
  </section>
</main>

<script type="module">
  import { createClient } from
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const SUPABASE_URL = 'https://bfiikxuyratcvhfmdeia.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_y0BudXGL8t3yDJLE4h5IZg_UZRPHJk6';

  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
  const status = document.getElementById('status');

  async function verifyAdmin() {
    const { data, error } = await supabase.rpc('is_cinevaals_admin');
    if (error || data !== true) {
      await supabase.auth.signOut();
      document.getElementById('login-area').style.display = 'block';
      document.getElementById('admin-area').style.display = 'none';
      status.textContent = 'Acesso administrativo não autorizado.';
      return false;
    }

    document.getElementById('login-area').style.display = 'none';
    document.getElementById('admin-area').style.display = 'block';
    return true;
  }

  document.getElementById('login-form').addEventListener('submit',
    async (event) => {
      event.preventDefault();
      status.textContent = 'Verificando acesso...';

      const { error } = await supabase.auth.signInWithPassword({
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value
      });

      if (error) {
        status.textContent = 'Erro: ' + error.message;
        return;
      }

      await verifyAdmin();
    });

  document.getElementById('content-form').addEventListener('submit',
    async (event) => {
      event.preventDefault();
      status.textContent = 'Salvando conteúdo...';

const content = {
  title: document.getElementById('title').value.trim(),
  category: document.getElementById('category').value,
  date: document.getElementById('date').value,
  image: document.getElementById('image').value.trim() || null,
  description: document.getElementById('description').value.trim() || null,
  time: document.getElementById('time').value || null,
  status: document.getElementById('status').value
};

      const { data, error } = await supabase
  .from('contents')
  .insert(content)
  .select();

console.log('Conteúdo enviado:', content);
console.log('Resposta do Supabase:', { data, error });

      if (error) {
        status.textContent = 'Erro ao salvar: ' + error.message;
        return;
      }

      status.textContent = 'Conteúdo cadastrado com sucesso!';
      document.getElementById('content-form').reset();
    });

  document.getElementById('logout').addEventListener('click', async () => {
    await supabase.auth.signOut();
    document.getElementById('admin-area').style.display = 'none';
    document.getElementById('login-area').style.display = 'block';
    status.textContent = 'Você saiu do painel.';
  });

  const { data: sessionData } = await supabase.auth.getSession();
  if (sessionData.session) await verifyAdmin();
</script>
</body>
</html>
