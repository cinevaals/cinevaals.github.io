<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administração | CineVaals</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    :root{--bg:#050811;--panel:#091426;--panel2:#0d1b30;--text:#f4f7ff;--muted:#a8b7cf;--blue:#168bff;--blue2:#355cff;--line:#19385b;--glow:rgba(20,130,255,.2)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}
    body{margin:0;background:radial-gradient(ellipse at 50% 0%,#10213b 0,#050811 46rem);color:var(--text);font-family:'Inter',Arial,sans-serif;min-height:100vh;padding:0}
    main{max-width:1800px;margin:auto;padding:25px 18px 40px}
    header,.toolbar,.day-head,.item,.week-controls{display:flex;align-items:center;justify-content:space-between;gap:12px}
    header{padding:10px 18px;min-height:56px;background:rgba(3,9,20,.94);border-bottom:1px solid var(--line);margin:0 -18px 24px}
    h1{font-family:Georgia,serif;font-size:24px;color:#58baff;text-shadow:0 0 14px #006dff80;margin:0}h2,h3,p{margin-top:0}
    .subtitle{color:#9bc9f4;margin:8px 0 0;font-size:13px}.panel{padding:20px;margin-top:18px;background:linear-gradient(180deg,#09172a,#060d19);border:1px solid #16385b;border-radius:11px;box-shadow:0 5px 18px #0003}
    #admin-area{display:none}.login{max-width:520px;margin:32px auto}label{display:block;margin-top:13px;font-size:.95rem}
    input,select,textarea,button{font:inherit;border-radius:9px}input,select,textarea{width:100%;padding:11px;margin-top:6px;background:#071326;color:white;border:1px solid #21466e}input:focus,select:focus,textarea:focus{outline:none;border-color:#56b9ff;box-shadow:0 0 0 3px #168bff22}
    button{padding:10px 13px;border:1px solid #204b79;background:linear-gradient(180deg,#0b1c33,#071225);color:#dceeff;font-weight:700;cursor:pointer}button:hover{border-color:#4cb5ff;filter:brightness(1.08)}button:disabled{opacity:.5;cursor:wait}
    .primary{background:linear-gradient(135deg,#1454d9,#087bdc);border-color:#4db8ff;color:white}.secondary{background:#0a172a}.danger{background:#321421;border-color:#71344d;color:#ffc4d5}.small{padding:7px 10px;font-size:.82rem}
    .toolbar{align-items:flex-start;flex-wrap:wrap}.toolbar h2{font-family:Georgia,'Times New Roman',serif;font-size:clamp(25px,3vw,38px);margin:0 0 7px;color:#eaf5ff;text-shadow:0 0 18px #1c8fff55}.toolbar .subtitle:before{content:'✦ ';color:#328eff}
    .week-controls{margin:27px 0 16px;flex-wrap:wrap}.week-title{font-weight:700;text-align:center;flex:1;min-width:190px;color:#f3f8ff;font-size:14px}.week-title small{display:block;font-size:10px;color:#60b9ff;margin-top:4px;font-weight:normal}
    .days-wrap{overflow-x:auto;padding:0 0 12px;scrollbar-color:#1b568d #07101e;scrollbar-width:thin}.days{display:grid;grid-template-columns:repeat(7,minmax(160px,1fr));gap:10px;min-width:1160px;align-items:stretch}
    .day{background:linear-gradient(180deg,#09172a,#060d19);border:1px solid #16385b;border-radius:11px;overflow:hidden;min-width:0;box-shadow:0 5px 18px #0003;padding:0}.day-head{margin:0;padding:11px 10px;background:linear-gradient(100deg,#102846,#0a172a);border-bottom:1px solid #1b4774;align-items:center}.day-head h3{margin:0;font-size:12px;font-weight:bold;color:#a8dcff}.day-date{display:block;color:#c0d0e5;font-size:11px;margin-top:4px}.day-items{padding:7px;display:flex;flex-direction:column;gap:8px;min-height:130px}
    .item{background:rgba(8,21,39,.86);border:1px solid #122d4d;border-radius:8px;padding:7px;align-items:stretch;gap:7px;transition:transform .15s,border-color .15s;cursor:grab}.item[draggable="true"]:active{cursor:grabbing}.item.dragging{opacity:.42;border:1px dashed #65bfff}.item.drag-over{border-color:#65bfff;box-shadow:0 0 0 2px #168bff33}.item:hover{transform:translateY(-2px);border-color:#2f83d1}.item-main{min-width:0;flex:1;align-self:center}.item-title{font-weight:700;font-size:12px;line-height:1.25;overflow-wrap:anywhere;margin:6px 0 4px;color:#f1f7ff}.category{display:inline-block;color:#8fd1ff;background:#0e3156;border:1px solid #164879;padding:3px 5px;border-radius:4px;font-size:8px;font-weight:bold;text-transform:uppercase;letter-spacing:.3px}.meta{font-size:10px;color:#65bfff;line-height:1.4;margin:3px 0;overflow-wrap:anywhere}.item-description{font-size:10px;color:#9daec4;line-height:1.35;overflow-wrap:anywhere}.item-actions{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;align-content:flex-start}.empty{color:#6e819c;font-size:11px;text-align:center;padding:24px 5px}.empty:before{content:'✧';display:block;font-size:19px;color:#235789;margin-bottom:7px}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.full{grid-column:1/-1}#status{overflow-wrap:anywhere;color:#65bfff;min-height:1.2em;margin:14px 0 0}.hidden{display:none!important}
    @media(max-width:700px){main{padding:20px 12px 30px}header{margin:0 -12px 20px;padding:8px 12px}h1{font-size:20px}.days{grid-template-columns:repeat(7,minmax(155px,1fr));min-width:1160px}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.week-controls button{font-size:.78rem;padding:9px 8px}.week-title{min-width:0}.toolbar{align-items:flex-start}}
  </style>
</head>
<body>
<main>
  <header>
    <div><h1>CineVaals</h1><p class="subtitle">Painel administrativo</p></div>
    <button id="logout" class="secondary hidden" type="button">Sair</button>
  </header>

  <section id="login-area" class="panel login">
    <h2>Entrar</h2>
    <form id="login-form">
      <label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required>
      <label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required>
      <button type="submit" style="width:100%;margin-top:18px">Entrar</button>
    </form>
  </section>

  <section id="admin-area">
    <div class="toolbar">
      <div><h2 style="margin-bottom:5px">✧ Cronograma Semanal</h2><p class="subtitle" style="margin-bottom:0">Gerencie a programação do CineVaals por aqui.</p></div>
      <button id="new-content" class="primary" type="button">＋ Adicionar conteúdo</button>
    </div>
    <div class="week-controls">
      <button id="prev-week" class="secondary" type="button">← Semana anterior</button>
      <div id="week-title" class="week-title"></div>
      <button id="next-week" class="secondary" type="button">Próxima semana →</button>
    </div>
    <div id="days" class="days"></div>

    <section id="editor" class="panel hidden">
      <h2 id="editor-title">Adicionar conteúdo</h2>
      <form id="content-form">
        <div class="form-grid">
          <div class="full"><label for="title">Título *</label><input id="title" required maxlength="200"></div>
          <div><label for="category">Categoria *</label><select id="category" required>
            <option value="Filme">Filmes</option><option value="Série">Séries</option><option value="Animação">Animações</option><option value="Dorama">Doramas</option><option value="Anime">Animes</option>
          </select></div>
          <div><label for="date">Data *</label><input id="date" type="date" required></div>
          <div><label for="time">Horário (opcional)</label><input id="time" type="time"></div>
          <div><label for="image">URL da imagem</label><input id="image" type="url" placeholder="https://..."></div>
          <div class="full"><label for="description">Descrição</label><textarea id="description" rows="3"></textarea></div>
        </div>
        <div class="toolbar" style="margin-top:15px;justify-content:flex-start;flex-wrap:wrap">
          <button id="save-content" type="submit">Salvar conteúdo</button>
          <button id="cancel-edit" class="secondary" type="button">Cancelar</button>
        </div>
      </form>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
  </section>
</main>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const SUPABASE_URL = 'https://bfiikxuyratcvhfmdeia.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_y0BudXGL8t3yDJLE4h5IZg_UZRPHJk6';
  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
  const $ = id => document.getElementById(id);
  const status = $('status');
  let weekStart = mondayOf(new Date());
  let contents = [];
  let editingId = null;
  let draggedId = null;

  function mondayOf(date){ const d = new Date(date); d.setHours(12,0,0,0); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return d; }
  function dateKey(date){ return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`; }
  function parseDate(value){ const [y,m,d]=value.split('-').map(Number); return new Date(y,m-1,d,12); }
  function prettyDate(date, options={day:'2-digit',month:'2-digit'}){ return date.toLocaleDateString('pt-BR',options); }
  function escapeHtml(value=''){ return String(value).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  async function verifyAdmin(){
    const {data,error}=await supabase.rpc('is_cinevaals_admin');
    if(error || data!==true){
      await supabase.auth.signOut();
      $('login-area').style.display='block'; $('admin-area').style.display='none'; $('logout').classList.add('hidden');
      status.textContent='Acesso administrativo não autorizado.'; return false;
    }
    $('login-area').style.display='none'; $('admin-area').style.display='block'; $('logout').classList.remove('hidden');
    await loadContents(); return true;
  }

  async function loadContents(){
    status.textContent='Carregando cronograma...';
    const {data,error}=await supabase.from('contents').select('*').order('date',{ascending:true}).order('sort_order',{ascending:true}).order('time',{ascending:true});
    if(error){ status.textContent='Erro ao carregar: '+error.message; return; }
    contents=data||[]; render(); status.textContent='';
  }

  function render(){
    const end=new Date(weekStart); end.setDate(end.getDate()+6);
    $('week-title').textContent=`${prettyDate(weekStart,{day:'2-digit',month:'short'})} – ${prettyDate(end,{day:'2-digit',month:'short',year:'numeric'})}`;
    const weekdays=['Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado','Domingo'];
    $('days').innerHTML=weekdays.map((name,i)=>{
      const d=new Date(weekStart); d.setDate(d.getDate()+i); const key=dateKey(d);
      const dayItems=contents.filter(item=>item.date===key).sort((a,b)=>{const ao=Number.isFinite(Number(a.sort_order))?Number(a.sort_order):999999;const bo=Number.isFinite(Number(b.sort_order))?Number(b.sort_order):999999;return ao-bo||(a.time||'99:99').localeCompare(b.time||'99:99');});
      const cards=dayItems.length?dayItems.map(item=>`
        <article class="item" draggable="true" data-drag-id="${escapeHtml(item.id)}">
          <div class="item-main"><span class="category">${escapeHtml(item.category||'Sem categoria')}</span><div class="item-title">${escapeHtml(item.title)}</div>
            <div class="meta">◷ ${escapeHtml(item.time||'Horário não definido')}</div>
            ${item.description?`<div class="item-description">${escapeHtml(item.description)}</div>`:''}
          </div>
          <div class="item-actions">
            <button class="small secondary" type="button" data-edit="${escapeHtml(item.id)}" aria-label="Editar ${escapeHtml(item.title)}">✎</button>
            <button class="small danger" type="button" data-delete="${escapeHtml(item.id)}" aria-label="Excluir ${escapeHtml(item.title)}">✕</button>
          </div>
        </article>`).join(''):'<div class="empty">Nenhum conteúdo programado.</div>';
      return `<section class="day"><div class="day-head"><div><h3>${name}</h3><span class="day-date">${prettyDate(d,{day:'2-digit',month:'short',year:'numeric'})}</span></div><button class="small primary" type="button" data-add-date="${key}" aria-label="Adicionar conteúdo em ${name}">＋</button></div><div class="day-items">${cards}</div></section>`;
    }).join('');
  }

  function openEditor(item=null, date=''){
    editingId=item?.id??null;
    $('editor-title').textContent=item?'Editar conteúdo':'Adicionar conteúdo';
    $('title').value=item?.title||''; $('category').value=item?.category||'Filme';
    $('date').value=item?.date||date||dateKey(weekStart);
    $('time').value=item?.time||''; $('image').value=item?.image||'';
    $('description').value=item?.description||'';
    $('save-content').textContent=item?'Salvar alterações':'Salvar conteúdo';
    $('editor').classList.remove('hidden'); $('editor').scrollIntoView({behavior:'smooth',block:'start'});
  }
  function closeEditor(){ $('editor').classList.add('hidden'); $('content-form').reset(); editingId=null; }

  $('login-form').addEventListener('submit',async event=>{
    event.preventDefault(); status.textContent='Verificando acesso...';
    const {error}=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
    if(error){status.textContent='Erro: '+error.message;return;}
    await verifyAdmin();
  });
  $('content-form').addEventListener('submit',async event=>{
    event.preventDefault(); $('save-content').disabled=true; status.textContent='Salvando conteúdo...';
    const targetDate=$('date').value;
    const existingForDate=contents.filter(x=>x.date===targetDate && String(x.id)!==String(editingId));
    const nextOrder=existingForDate.reduce((max,x)=>Math.max(max,Number(x.sort_order)||0),-1)+1;
    const content={title:$('title').value.trim(),category:$('category').value,date:targetDate,image:$('image').value.trim()||null,description:$('description').value.trim()||null,time:$('time').value||null,sort_order:editingId?(contents.find(x=>String(x.id)===String(editingId))?.date===targetDate?(contents.find(x=>String(x.id)===String(editingId))?.sort_order??nextOrder):nextOrder):nextOrder};
    const result=editingId?await supabase.from('contents').update(content).eq('id',editingId):await supabase.from('contents').insert(content);
    $('save-content').disabled=false;
    if(result.error){status.textContent='Erro ao salvar: '+result.error.message;return;}
    closeEditor(); await loadContents(); status.textContent=editingId?'':'Conteúdo salvo com sucesso!';
  });
  $('days').addEventListener('click',async event=>{
    const edit=event.target.closest('[data-edit]'), del=event.target.closest('[data-delete]'), add=event.target.closest('[data-add-date]');
    if(add){openEditor(null,add.dataset.addDate);return;}
    if(edit){const item=contents.find(x=>String(x.id)===edit.dataset.edit);if(item)openEditor(item);return;}
    if(del){
      const item=contents.find(x=>String(x.id)===del.dataset.delete); if(!item)return;
      if(!confirm(`Excluir "${item.title}" do cronograma?`))return;
      status.textContent='Excluindo conteúdo...';
      const {error}=await supabase.from('contents').delete().eq('id',item.id);
      if(error){status.textContent='Erro ao excluir: '+error.message;return;}
      await loadContents(); status.textContent='Conteúdo excluído.';
    }
  });
  $('days').addEventListener('dragstart', event=>{
    const card=event.target.closest('[data-drag-id]');
    if(!card)return;
    draggedId=card.dataset.dragId;
    card.classList.add('dragging');
    event.dataTransfer.effectAllowed='move';
    event.dataTransfer.setData('text/plain',draggedId);
  });
  $('days').addEventListener('dragover', event=>{
    const target=event.target.closest('[data-drag-id]');
    if(!target || !draggedId || target.dataset.dragId===draggedId)return;
    const source=contents.find(x=>String(x.id)===String(draggedId));
    const destination=contents.find(x=>String(x.id)===target.dataset.dragId);
    if(!source || !destination || source.date!==destination.date)return;
    event.preventDefault();
    document.querySelectorAll('.item.drag-over').forEach(el=>el.classList.remove('drag-over'));
    target.classList.add('drag-over');
  });
  $('days').addEventListener('drop', async event=>{
    const target=event.target.closest('[data-drag-id]');
    if(!target || !draggedId)return;
    const source=contents.find(x=>String(x.id)===String(draggedId));
    const destination=contents.find(x=>String(x.id)===target.dataset.dragId);
    if(!source || !destination || source.date!==destination.date)return;
    event.preventDefault();
    const sameDay=contents.filter(x=>x.date===source.date).sort((a,b)=>{
      const ao=Number.isFinite(Number(a.sort_order))?Number(a.sort_order):999999;
      const bo=Number.isFinite(Number(b.sort_order))?Number(b.sort_order):999999;
      return ao-bo||(a.time||'99:99').localeCompare(b.time||'99:99');
    });
    const from=sameDay.findIndex(x=>String(x.id)===String(draggedId));
    const to=sameDay.findIndex(x=>String(x.id)===target.dataset.dragId);
    if(from<0||to<0)return;
    const [moved]=sameDay.splice(from,1);sameDay.splice(to,0,moved);
    status.textContent='Salvando nova ordem...';
    const updates=await Promise.all(sameDay.map((item,index)=>supabase.from('contents').update({sort_order:index}).eq('id',item.id)));
    const failed=updates.find(result=>result.error);
    if(failed){status.textContent='Não foi possível salvar a ordem. Verifique se a coluna sort_order foi criada no Supabase.';await loadContents();return;}
    await loadContents();status.textContent='Ordem atualizada!';
  });
  $('days').addEventListener('dragend',()=>{
    draggedId=null;
    document.querySelectorAll('.item.dragging,.item.drag-over').forEach(el=>el.classList.remove('dragging','drag-over'));
  });

  $('new-content').addEventListener('click',()=>openEditor());
  $('cancel-edit').addEventListener('click',closeEditor);
  $('prev-week').addEventListener('click',()=>{weekStart.setDate(weekStart.getDate()-7);render();});
  $('next-week').addEventListener('click',()=>{weekStart.setDate(weekStart.getDate()+7);render();});
  $('logout').addEventListener('click',async()=>{await supabase.auth.signOut();$('admin-area').style.display='none';$('login-area').style.display='block';$('logout').classList.add('hidden');status.textContent='Você saiu do painel.';});
  const {data:sessionData}=await supabase.auth.getSession();
  if(sessionData.session) await verifyAdmin();
</script>
</body>
</html>
